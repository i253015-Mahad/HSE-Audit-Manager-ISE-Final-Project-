spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from schema-test.sql; validate entity mappings
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      # Test-only, H2-compatible schema and seed (the production MySQL scripts stay in src/main/resources)
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

  thymeleaf:
    cache: false

  # Photograph evidence is written outside the repo so tests never dirty ./data/photos.
hse:
  photos:
    directory: ${java.io.tmpdir}/hse-photo-tests

logging:
  level:
    org.hibernate.SQL: warn
