<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body class="page-login">

<main class="login-card">
    <h1>HSE Safety Reporting</h1>
    <p class="subtitle">Sign in with your company email</p>

    <form class="stack" th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <div class="password-field">
            <input id="password" class="password-input" name="password" type="password"
                   autocomplete="current-password" required>
            <button id="password-toggle" class="password-toggle" type="button"
                    aria-controls="password" aria-label="Show password" aria-pressed="false"
                    title="Show password">
                <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.8"></path>
                    <path d="M6.2 8.2A18 18 0 0 0 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"></path>
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
            </button>
        </div>

        <p class="alert error" th:if="${param.error}">Invalid email or password.</p>
        <p class="alert info" th:if="${param.logout}">You have been logged out.</p>
        <p class="alert info" th:if="${showSessionExpired}">Your session has expired. Please sign in again.</p>

        <button class="primary" type="submit">Sign in</button>
    </form>

    <p class="hint">Access is limited to company accounts provisioned by Account Administration.</p>
</main>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
