<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!--
  Shared top navigation fragment (Slice 2 — Dashboard Interface).
  Keep the static fallback copy inside dashboard.html in sync with this markup.

  TODO(MANAL / Slice 1 — auth): user name + role must come from the
    server-side authenticated session; logout must be handled by Spring
    Security (AGENTS.md §8 — never rely on client-side hiding alone).
  TODO(EMAN / Slice 3): add the "Reports" link when the report interface lands.
  TODO(MANAL): the "Projects" link visibility (Admin/Manager) must be
    enforced server-side with the route — hiding alone is not enforcement.
-->
<header class="topbar" th:fragment="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/dashboard" th:href="@{/dashboard}">HSE Safety Reporting</a>

        <nav class="main-nav" aria-label="Primary">
            <a class="nav-link active" href="/dashboard" th:href="@{/dashboard}" aria-current="page">Dashboard</a>
            <!-- TODO(EMAN / Slice 3): <a class="nav-link" href="/reports">Reports</a> -->
            <a class="nav-link" href="/projects" th:href="@{/projects}">Projects</a>
        </nav>

        <div class="user-area">
            <!-- TODO(MANAL / Slice 1): replace both placeholders with currentUser / currentRole -->
            <span class="user-name">Signed-in user</span>
            <span class="user-role-chip">Role</span>
            <a class="btn-logout" href="/logout">Log out</a>
        </div>
    </div>
</header>

</body>
</html>
