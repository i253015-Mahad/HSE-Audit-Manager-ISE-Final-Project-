# ADR-08: MySQL + Spring Data JPA, local filesystem photograph storage.
spring.datasource.url=${HSE_DB_URL:jdbc:mysql://127.0.0.1:3306/hse_reporting?createDatabaseIfNotExist=true}
spring.datasource.username=${HSE_DB_USERNAME:root}
spring.datasource.password=${HSE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Photograph storage (ADR-06). Files live outside the database.
hse.photos.directory=${HSE_PHOTO_DIR:./data/photos}

# Team-supplied value lists. Empty by default: add the agreed lists before use.
# The OTHER option is always available and allows free text (team decision).
hse.form.other-option=OTHER
hse.form.hazard-categories=
hse.form.severity-levels=

# Photograph constraints (team decision, 27 Nov 2026).
# per violation: max 3 photographs, 10 MB each, JPEG or PNG only.
